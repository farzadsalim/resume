  function hexToBytes(hex){
    var out = new Uint8Array(hex.length/2);
    for(var i=0;i<out.length;i++) out[i]=parseInt(hex.substr(i*2,2),16);
    return out;
  }
  function b64ToBytes(b64){
    var bin = atob(b64);
    var out = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i);
    return out;
  }

  var err = document.getElementById("err");

  form.addEventListener("submit", function(e){
    e.preventDefault();
    err.textContent = "";
    var password = pwInput.value;
    var enc = new TextEncoder();
    crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"])
      .then(function(baseKey){
        return crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: hexToBytes(saltHex), iterations: 300000, hash: "SHA-256" },
          baseKey,
          { name: "AES-GCM", length: 256 },
          false,
          ["decrypt"]
        );
      })
      .then(function(key){
        return crypto.subtle.decrypt(
          { name: "AES-GCM", iv: hexToBytes(ivHex) },
          key,
          b64ToBytes(payloadB64)
        );
      })
      .then(function(decrypted){
        var html = new TextDecoder().decode(decrypted);
        document.open();
        document.write(html);
        document.close();
      })
      .catch(function(){
        err.textContent = "Incorrect passcode.";
      });
  });
})();
</script>
</body>
</html>
